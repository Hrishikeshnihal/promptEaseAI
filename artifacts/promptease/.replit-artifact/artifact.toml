kind = "web"
previewPath = "/"
title = "PromptEase AI"
version = "1.0.0"
id = "artifacts/promptease"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25533

[services.development]
run = "pnpm --filter @workspace/promptease run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/promptease", "run", "build" ]
publicDir = "artifacts/promptease/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25533"
BASE_PATH = "/"
